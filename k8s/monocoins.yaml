---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: monocoins
  name: monocoins
spec:
  containers:
  - name: hasher
    image: dockercoins/hasher:v0.1
    imagePullPolicy: Always
    command:
    - ruby
    - hasher.rb
    - -o
    - "::"
    - -p
    - "8001"
  - name: redis
    image: redis
  - name: rng
    image: dockercoins/rng:v0.1
    env:
    - name: FLASK_RUN_PORT
      value: "8002"
  - name: webui
    image: dockercoins/webui:v0.1
  - name: worker
    image: dockercoins/worker:v0.1
---
apiVersion: v1
kind: Service
metadata:
  name: hasher
spec:
  selector:
    run: monocoins
  ports:
  - port: 80
    targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    run: monocoins
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: rng
spec:
  selector:
    run: monocoins
  ports:
  - port: 80
    targetPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: webui
spec:
  selector:
    run: monocoins
  ports:
  - port: 80
    targetPort: 80
